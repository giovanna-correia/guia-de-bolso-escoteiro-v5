<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#566944"><title>Cadastro de Kit | Administração</title><link rel="icon" href="../../../recursos/imagens/icones/marca.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../../../compartilhado/estilos/variaveis.css"><link rel="stylesheet" href="../../../componentes/cabecalho-administrativo/cabecalho-administrativo.css"><link rel="stylesheet" href="../../../componentes/menu-administrativo/menu-administrativo.css"><link rel="stylesheet" href="../../../componentes/modal-confirmacao/modal-confirmacao.css"><link rel="stylesheet" href="../../../componentes/mensagem-retorno/mensagem-retorno.css"><link rel="stylesheet" href="./kit-formulario.css">
  </head>
  <body data-raiz="../../../"><div id="menu-administrativo"></div><div id="cabecalho-administrativo"></div>
    <main class="kit-formulario__principal"><a class="kit-formulario__voltar" href="../kits-listagem/index.html">← Voltar para kits</a><header><p class="kit-formulario__etiqueta">COMPOSIÇÃO DE CAMPO</p><h2 id="titulo-formulario" class="kit-formulario__titulo">Criar kit</h2></header>
      <form id="formulario-kit" class="kit-formulario__formulario" novalidate><fieldset><legend>1. Informações do kit</legend><div class="kit-formulario__grade"><div class="kit-formulario__grupo"><label for="campo-nome">Nome</label><input id="campo-nome" maxlength="120"><p id="erro-nome" class="kit-formulario__erro"></p></div><div class="kit-formulario__grupo"><label for="campo-tipo">Tipo</label><select id="campo-tipo"><option value="caixa_patrulha">Caixa de patrulha</option><option value="cozinha">Cozinha</option><option value="pioneiria">Pioneiria</option><option value="primeiros_socorros">Primeiros socorros</option><option value="limpeza">Limpeza</option><option value="cerimonia">Cerimônia</option><option value="acampamento">Acampamento</option><option value="outro">Outro</option></select><p class="kit-formulario__erro"></p></div><div class="kit-formulario__grupo"><label for="campo-secao">Seção</label><select id="campo-secao"><option value="">Uso geral</option></select><p class="kit-formulario__erro"></p></div><div class="kit-formulario__grupo"><label for="campo-patrulha">Patrulha ou equipe</label><select id="campo-patrulha"><option value="">Não informada</option></select><p id="erro-patrulha" class="kit-formulario__erro"></p></div><div class="kit-formulario__grupo kit-formulario__grupo--largo"><label for="campo-observacoes">Observações</label><textarea id="campo-observacoes" rows="3"></textarea><p class="kit-formulario__erro"></p></div></div></fieldset>
        <fieldset><legend>2. Seleção de materiais</legend><div class="kit-formulario__adicionar-item"><div><label for="campo-material">Material</label><select id="campo-material"><option value="">Selecione</option></select></div><div><label for="campo-quantidade">Quantidade necessária</label><input id="campo-quantidade" type="number" min="1" step="1" value="1"></div><button id="botao-adicionar-material" type="button">Adicionar ou atualizar</button></div><p id="erro-material" class="kit-formulario__erro"></p><div id="lista-itens" class="kit-formulario__itens"></div></fieldset>
        <fieldset><legend>3. Revisão</legend><p id="resumo-kit" class="kit-formulario__resumo">Nenhum material adicionado.</p></fieldset><p id="erro-geral" class="kit-formulario__erro kit-formulario__erro--geral" role="alert"></p><footer class="kit-formulario__acoes"><a href="../kits-listagem/index.html">Cancelar</a><button type="submit">Salvar kit</button></footer>
      </form>
    </main><script type="module" src="./kit-formulario.ts"></script>
  </body>
</html>
