<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#566944"><title>Adicionar Pendência | Administração</title><link rel="icon" href="../../../recursos/imagens/icones/marca.svg" type="image/svg+xml"><link rel="stylesheet" href="../../../compartilhado/estilos/variaveis.css"><link rel="stylesheet" href="../../../componentes/cabecalho-administrativo/cabecalho-administrativo.css"><link rel="stylesheet" href="../../../componentes/menu-administrativo/menu-administrativo.css"><link rel="stylesheet" href="./manutencao-formulario.css"></head>
<body data-raiz="../../../"><div id="menu-administrativo"></div><div id="cabecalho-administrativo"></div><main class="manutencao-formulario__principal"><a class="manutencao-formulario__voltar" href="../manutencoes-listagem/index.html">← Voltar para manutenções</a><header><p class="manutencao-formulario__etiqueta">CUIDADO COM O PATRIMÔNIO</p><h2 class="manutencao-formulario__titulo">Adicionar pendência</h2><p class="manutencao-formulario__legenda"><span aria-hidden="true">*</span> Campos obrigatórios</p></header><form id="formulario-manutencao" class="manutencao-formulario__formulario" novalidate><div class="manutencao-formulario__grupo"><label for="campo-material">Material <span>*</span></label><select id="campo-material" required><option value="">Selecione</option></select><p id="erro-material" class="manutencao-formulario__erro"></p></div><div class="manutencao-formulario__grupo"><label for="campo-tipo">Tipo da pendência <span>*</span></label><select id="campo-tipo" required><option value="">Selecione</option><option value="limpeza">Limpeza</option><option value="secagem">Secagem</option><option value="afiacao">Afiação</option><option value="costura">Costura</option><option value="impermeabilizacao">Impermeabilização</option><option value="reposicao_componente">Reposição de componente</option><option value="conserto">Conserto</option><option value="avaliacao_descarte">Avaliação para descarte</option><option value="outro">Outro</option></select><p id="erro-tipo" class="manutencao-formulario__erro"></p></div><div class="manutencao-formulario__grupo"><label for="campo-responsavel">Responsável escotista <span>*</span></label><select id="campo-responsavel" required><option value="">Selecione</option></select><p id="erro-responsavel" class="manutencao-formulario__erro"></p></div><div class="manutencao-formulario__grupo"><label for="campo-custo-estimado">Custo estimado (R$)</label><input id="campo-custo-estimado" type="number" min="0.01" step="0.01"><p id="erro-custo" class="manutencao-formulario__erro"></p></div><div class="manutencao-formulario__grupo manutencao-formulario__largo"><label for="campo-descricao">Problema ou necessidade <span>*</span></label><textarea id="campo-descricao" rows="3" maxlength="500" required></textarea><p id="erro-descricao" class="manutencao-formulario__erro"></p></div><div class="manutencao-formulario__grupo manutencao-formulario__largo"><label for="campo-observacoes">Observações</label><textarea id="campo-observacoes" rows="3" maxlength="500"></textarea><p class="manutencao-formulario__erro"></p></div><p id="erro-geral" class="manutencao-formulario__erro manutencao-formulario__erro--geral" role="alert"></p><footer class="manutencao-formulario__acoes"><a href="../manutencoes-listagem/index.html">Cancelar</a><button type="submit">Salvar pendência</button></footer></form></main><script type="module" src="./manutencao-formulario.ts"></script></body></html>
