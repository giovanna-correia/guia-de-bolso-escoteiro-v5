<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#566944"><title>Cadastro de Atividade | Administração</title><link rel="icon" href="../../../recursos/imagens/icones/marca.svg" type="image/svg+xml"><link rel="stylesheet" href="../../../compartilhado/estilos/variaveis.css"><link rel="stylesheet" href="../../../componentes/cabecalho-administrativo/cabecalho-administrativo.css"><link rel="stylesheet" href="../../../componentes/menu-administrativo/menu-administrativo.css"><link rel="stylesheet" href="../../../componentes/modal-confirmacao/modal-confirmacao.css"><link rel="stylesheet" href="../../../componentes/mensagem-retorno/mensagem-retorno.css"><link rel="stylesheet" href="./atividade-formulario.css"></head>
  <body data-raiz="../../../"><div id="menu-administrativo"></div><div id="cabecalho-administrativo"></div><main class="atividade-formulario__principal"><a class="atividade-formulario__voltar" href="../atividades-listagem/index.html">← Voltar para atividades</a><header><p class="atividade-formulario__etiqueta">PLANEJAMENTO</p><h2 id="titulo-formulario" class="atividade-formulario__titulo">Criar atividade</h2><p class="atividade-formulario__legenda"><span aria-hidden="true">*</span> Campos obrigatórios</p></header>
    <form id="formulario-atividade" class="atividade-formulario__formulario" novalidate><fieldset><legend>Informações da atividade</legend><div class="atividade-formulario__grade"><div class="atividade-formulario__grupo atividade-formulario__grupo--largo"><label for="campo-nome">Nome <span class="atividade-formulario__obrigatorio" aria-hidden="true">*</span></label><input id="campo-nome" maxlength="120" required><p id="erro-nome" class="atividade-formulario__erro"></p></div><div class="atividade-formulario__grupo"><label for="campo-tipo">Tipo <span class="atividade-formulario__obrigatorio" aria-hidden="true">*</span></label><select id="campo-tipo" required><option value="reuniao">Reunião</option><option value="acampamento">Acampamento</option><option value="acantonamento">Acantonamento</option><option value="jornada">Jornada</option><option value="trilha">Trilha</option><option value="mutirao">Mutirão</option><option value="cerimonia">Cerimônia</option><option value="outro">Outro</option></select><p class="atividade-formulario__erro"></p></div><div class="atividade-formulario__grupo"><label for="campo-local">Local <span class="atividade-formulario__obrigatorio" aria-hidden="true">*</span></label><input id="campo-local" maxlength="120" required><p id="erro-local" class="atividade-formulario__erro"></p></div><div class="atividade-formulario__grupo"><label for="campo-saida">Data de saída <span class="atividade-formulario__obrigatorio" aria-hidden="true">*</span></label><input id="campo-saida" type="date" required><p id="erro-saida" class="atividade-formulario__erro"></p></div><div class="atividade-formulario__grupo"><label for="campo-retorno">Data de retorno <span class="atividade-formulario__obrigatorio" aria-hidden="true">*</span></label><input id="campo-retorno" type="date" required><p id="erro-retorno" class="atividade-formulario__erro"></p></div><div class="atividade-formulario__grupo"><label for="campo-secao">Seção <span class="atividade-formulario__obrigatorio" aria-hidden="true">*</span></label><select id="campo-secao" required><option value="">Selecione</option></select><p id="erro-secao" class="atividade-formulario__erro"></p></div><div class="atividade-formulario__grupo"><label for="campo-responsavel">Responsável <span class="atividade-formulario__obrigatorio" aria-hidden="true">*</span></label><select id="campo-responsavel" required><option value="">Selecione</option></select><p id="erro-responsavel" class="atividade-formulario__erro"></p></div><div class="atividade-formulario__grupo"><label for="campo-jovens">Quantidade de jovens <span class="atividade-formulario__obrigatorio" aria-hidden="true">*</span></label><input id="campo-jovens" type="number" min="0" step="1" value="0" required><p id="erro-participantes" class="atividade-formulario__erro"></p></div><div class="atividade-formulario__grupo"><label for="campo-adultos">Quantidade de adultos <span class="atividade-formulario__obrigatorio" aria-hidden="true">*</span></label><input id="campo-adultos" type="number" min="1" step="1" value="1" required><p class="atividade-formulario__erro"></p></div><div class="atividade-formulario__grupo atividade-formulario__grupo--largo"><label for="campo-observacoes">Observações</label><textarea id="campo-observacoes" rows="3"></textarea><p class="atividade-formulario__erro"></p></div></div></fieldset>
      <fieldset><legend>Carga de materiais</legend><div class="atividade-formulario__adicionar"><div><label for="campo-carga">Material <span class="atividade-formulario__obrigatorio" aria-hidden="true">*</span></label><select id="campo-carga" required><option value="">Selecione</option></select><small id="ajuda-disponibilidade"></small></div><div><label for="campo-quantidade">Quantidade <span class="atividade-formulario__obrigatorio" aria-hidden="true">*</span></label><input id="campo-quantidade" type="number" min="1" step="1" value="1" required></div><button id="botao-adicionar-carga" type="button">Adicionar ou atualizar</button></div><p id="erro-carga" class="atividade-formulario__erro"></p><div id="lista-carga" class="atividade-formulario__itens"></div></fieldset><p id="erro-geral" class="atividade-formulario__erro atividade-formulario__erro--geral" role="alert"></p><footer class="atividade-formulario__acoes"><a href="../atividades-listagem/index.html">Cancelar</a><button type="submit">Salvar atividade</button></footer>
    </form></main><script type="module" src="./atividade-formulario.ts"></script></body></html>
