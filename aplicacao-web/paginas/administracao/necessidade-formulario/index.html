<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#566944"><title>Registrar Necessidade | Administração</title><link rel="icon" href="../../../recursos/imagens/icones/marca.svg" type="image/svg+xml"><link rel="stylesheet" href="../../../compartilhado/estilos/variaveis.css"><link rel="stylesheet" href="../../../componentes/cabecalho-administrativo/cabecalho-administrativo.css"><link rel="stylesheet" href="../../../componentes/menu-administrativo/menu-administrativo.css"><link rel="stylesheet" href="../../../componentes/modal-confirmacao/modal-confirmacao.css"><link rel="stylesheet" href="../../../componentes/mensagem-retorno/mensagem-retorno.css"><link rel="stylesheet" href="./necessidade-formulario.css"><link rel="stylesheet" href="../../../compartilhado/estilos/refinamentos.css"></head>
  <body data-raiz="../../../"><div id="menu-administrativo"></div><div id="cabecalho-administrativo"></div><main class="necessidade-formulario__principal"><a class="necessidade-formulario__voltar" href="../necessidades-listagem/index.html">← Voltar para necessidades</a><header><p class="necessidade-formulario__etiqueta">PLANEJAMENTO DE COMPRA</p><h2 id="titulo-formulario" class="necessidade-formulario__titulo">Registrar necessidade</h2><p class="necessidade-formulario__legenda"><span aria-hidden="true">*</span> Campos obrigatórios</p></header><form id="formulario-necessidade" class="necessidade-formulario__formulario" novalidate><div class="necessidade-formulario__grupo necessidade-formulario__largo"><label for="campo-material">Vincular a material existente</label><select id="campo-material"><option value="">Novo material</option></select><p class="necessidade-formulario__erro"></p></div><div class="necessidade-formulario__grupo"><label for="campo-nome">Nome do material <span class="necessidade-formulario__obrigatorio" aria-hidden="true">*</span></label><input id="campo-nome" maxlength="120" required><p id="erro-nome" class="necessidade-formulario__erro"></p></div><div class="necessidade-formulario__grupo"><label for="campo-secao">Seção solicitante</label><select id="campo-secao"><option value="">Uso geral</option></select><p class="necessidade-formulario__erro"></p></div><div class="necessidade-formulario__grupo"><label for="campo-atual">Quantidade atual <span class="necessidade-formulario__obrigatorio" aria-hidden="true">*</span></label><input id="campo-atual" type="number" min="0" step="1" value="0" required><p id="erro-quantidades" class="necessidade-formulario__erro"></p></div><div class="necessidade-formulario__grupo"><label for="campo-desejada">Quantidade desejada <span class="necessidade-formulario__obrigatorio" aria-hidden="true">*</span></label><input id="campo-desejada" type="number" min="1" step="1" required><p class="necessidade-formulario__erro"></p></div><div class="necessidade-formulario__grupo"><label for="campo-valor">Valor unitário estimado (R$)</label><input id="campo-valor" type="number" min="0.01" step="0.01"><p id="erro-valor" class="necessidade-formulario__erro"></p></div><div class="necessidade-formulario__grupo"><label for="campo-prioridade">Prioridade <span class="necessidade-formulario__obrigatorio" aria-hidden="true">*</span></label><select id="campo-prioridade" required><option value="baixa">Baixa</option><option value="media">Média</option><option value="alta">Alta</option><option value="urgente">Urgente</option></select><p class="necessidade-formulario__erro"></p></div><div class="necessidade-formulario__grupo"><label for="campo-fonte">Fonte do recurso <span class="necessidade-formulario__obrigatorio" aria-hidden="true">*</span></label><select id="campo-fonte" required><option value="nao_definida">Não definida</option><option value="emenda">Emenda</option><option value="doacao">Doação</option><option value="recurso_proprio">Recurso próprio</option></select><p class="necessidade-formulario__erro"></p></div><div class="necessidade-formulario__grupo necessidade-formulario__largo"><label for="campo-justificativa">Justificativa escoteira <span class="necessidade-formulario__obrigatorio" aria-hidden="true">*</span></label><textarea id="campo-justificativa" rows="3" required></textarea><p id="erro-justificativa" class="necessidade-formulario__erro"></p></div><output id="resumo-calculo" class="necessidade-formulario__calculo">A comprar: 0 · Total estimado: R$ 0,00</output><p id="erro-geral" class="necessidade-formulario__erro necessidade-formulario__erro--geral"></p><footer class="necessidade-formulario__acoes"><a href="../necessidades-listagem/index.html">Cancelar</a><button type="submit">Salvar necessidade</button></footer></form></main><script type="module" src="./necessidade-formulario.ts"></script></body></html>
